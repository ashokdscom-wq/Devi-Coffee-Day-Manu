      --bg: #f8f5f0;
      --card-bg: #ffffff;
      --text-dark: #22150e;
      --text-muted: #6e5f55;
      --border-color: #eedcc9;
      --veg-green: #0f8a3c;
      --whatsapp: #25D366;
      --whatsapp-dark: #128C7E;
      --shadow-sm: 0 2px 8px rgba(42, 19, 9, 0.05);
      --shadow-md: 0 6px 18px rgba(42, 19, 9, 0.08);

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }

    /* Header */
    .header {
      background: var(--primary-gradient);
      color: #fff;
      padding: 22px 16px 18px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    }
    .brand-logo-wrap {
      width: 82px;
      height: 82px;
      margin: 0 auto 10px;
      border-radius: 50%;
      background: #f7efe6;
      padding: 2px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
      border: 2px solid var(--accent-gold);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }
    .brand-title { font-size: 23px; font-weight: 800; letter-spacing: 1.5px; color: #fbf6f0; }
    .brand-sub { font-size: 11px; letter-spacing: 3px; color: var(--accent-gold); text-transform: uppercase; margin-top: 2px; font-weight: 700; }
    .table-badge {
      display: inline-block;
      margin-top: 10px;
      background: rgba(212, 163, 115, 0.2);
      border: 1.5px solid var(--accent-gold);
      color: #fff;
      padding: 5px 20px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 800;
      backdrop-filter: blur(4px);
    }

    /* Quick Service Bar */
    .service-bar {
      max-width: 720px;
      margin: 12px auto 0;
      padding: 0 16px;
      display: flex;
      gap: 10px;
    }
    .service-btn {
      flex: 1;
      background: #fff;
      border: 1.5px solid var(--border-color);
      padding: 9px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      color: var(--primary);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Search Box */
    .search-box { padding: 12px 16px 4px; max-width: 720px; margin: auto; }
    .search-box input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 14px;
      border: 1.5px solid var(--border-color);
      outline: none;
      font-size: 14px;
      background: #fff;
      box-shadow: var(--shadow-sm);
    }
    .search-box input:focus { border-color: var(--accent-gold); }

    /* Category Navigation */
    .categories-nav {
      display: flex;
      overflow-x: auto;
      padding: 10px 16px;
      gap: 8px;
      scrollbar-width: none;
      max-width: 720px;
      margin: auto;
    }
    .categories-nav::-webkit-scrollbar { display: none; }
    .cat-btn {
      white-space: nowrap;
      padding: 9px 18px;
      background: #ede2d4;
      color: var(--primary);
      border: none;
      border-radius: 25px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .cat-btn.active { background: var(--primary); color: #fff; transform: scale(1.02); }

    /* Menu Container */
    .menu-container { max-width: 720px; margin: auto; padding: 6px 16px; }
    .menu-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-color);
    }
    .item-details { flex: 1; padding-right: 12px; }
    .item-top { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
    .veg-icon {
      width: 15px;
      height: 15px;
      border: 1.5px solid var(--veg-green);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 3px;
    }
    .veg-icon span { width: 7px; height: 7px; background: var(--veg-green); border-radius: 50%; }
    .item-badge {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .badge-bestseller { background: #ffe9b1; color: #8a5300; }
    .badge-special { background: #fed7d7; color: #9b1c1c; }
    .item-name { font-size: 15px; font-weight: 800; color: var(--text-dark); }
    .item-desc { font-size: 12px; color: var(--text-muted); line-height: 1.35; margin: 4px 0 6px; }
    .item-price { font-size: 16px; font-weight: 800; color: var(--primary); }

    /* Quantity Controls */
    .qty-controls {
      display: flex;
      align-items: center;
      background: #f7efe6;
      border-radius: 12px;
      padding: 4px;
      border: 1px solid var(--border-color);
      flex-shrink: 0;
    }
    .qty-btn {
      background: #fff;
      color: var(--primary);
      border: 1px solid #dfcfbe;
      width: 34px;
      height: 34px;
      border-radius: 9px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .qty-btn:active { background: var(--accent); color: #fff; }
    .qty-count { min-width: 30px; text-align: center; font-weight: 800; font-size: 15px; color: var(--primary); }

    /* Note Input & Social Footer */
    .note-section { max-width: 720px; margin: 16px auto 0; padding: 0 16px; }

      padding: 13px 16px;
      border-radius: 14px;
      border: 1.5px solid var(--border-color);
      background: #fff;
      font-size: 13px;
      outline: none;

    .social-footer {

      margin: 20px auto 10px;
      text-align: center;
      padding: 0 16px;

      border-radius: 20px;
      border: 1px solid #f8c8e3;

      left: 0;
      right: 0;

      padding: 14px 20px;

    let cart = {};
    let activeCategory = 'all';

    function renderMenu() {
      const container = document.getElementById('menuList');
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      container.innerHTML = '';

      let filtered = menuData.filter(item => {
        let matchCat = (activeCategory === 'all' || item.cat === activeCategory);
        let matchSearch = item.name.toLowerCase().includes(q) || item.desc.toLowerCase().includes(q);
        return matchCat && matchSearch;
      });

      filtered.forEach(item => {
        let qty = cart[item.id] ? cart[item.id].qty : 0;
        let badgeHtml = '';
        if (item.badge === 'bestseller') badgeHtml = '<span class="item-badge badge-bestseller">★ Bestseller</span>';
        if (item.badge === 'special') badgeHtml = '<span class="item-badge badge-special">✦ Special</span>';

        let div = document.createElement('div');
        div.className = 'menu-card';
        div.innerHTML = `
          <div class="item-details">
            <div class="item-top">
              <div class="veg-icon"><span></span></div>
              ${badgeHtml}
              <div class="item-name">${item.name}</div>
            </div>
            <div class="item-desc">${item.desc}</div>
            <div class="item-price">₹${item.price}</div>
          </div>
          <div class="qty-controls">
            <button class="qty-btn" onclick="updateQty(${item.id}, -1)">-</button>
            <span class="qty-count" id="c-${item.id}">${qty}</span>
            <button class="qty-btn" onclick="updateQty(${item.id}, 1)">+</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function updateQty(id, delta) {
      const item = menuData.find(i => i.id === id);
      if (!cart[id]) cart[id] = { ...item, qty: 0 };
      cart[id].qty += delta;
      if (cart[id].qty <= 0) delete cart[id];

      const countEl = document.getElementById(`c-${id}`);
      if (countEl) countEl.innerText = cart[id] ? cart[id].qty : 0;
      updateTotal();
    }

    function updateTotal() {
      let totalQty = 0, totalPrice = 0;
      for (let id in cart) {
        totalQty += cart[id].qty;
        totalPrice += cart[id].qty * cart[id].price;
      }
      document.getElementById('cartCount').innerText = `${totalQty} આઇટમ્સ સિલેક્ટ કરી`;
      document.getElementById('cartTotal').innerText = totalPrice;
    }

    function filterCategory(cat, btn) {
      activeCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderMenu();
    }

    function sendServiceReq(serviceType) {
      let message = `🛎️ *DEVI COFFEE DAY - સર્વિસ રિક્વેસ્ટ*\n` +
                    `📍 *ટેબલ નંબર:* ${tableNumber}\n` +
                    `📌 *રિક્વેસ્ટ:* ${serviceType}\n` +
                    `_કૃપા કરીને ટેબલ પર સ્ટાફ મોકલો._`;
      let url = `https://wa.me/${RESTAURANT_PHONE}?text=${encodeURIComponent(message)}`;
      window.open(url, '_blank');
    }

    function sendOrderWhatsApp() {
      let total = 0;
      let orderItemsText = "";

      for (let id in cart) {
        if (cart[id].qty > 0) {
          let itemCost = cart[id].qty * cart[id].price;
          total += itemCost;
          orderItemsText += `• *${cart[id].name}* x ${cart[id].qty} = ₹${itemCost}\n`;
        }
      }

      if (orderItemsText === "") {
        alert("કૃપા કરીને પહેલા વાનગી પસંદ કરો (+ બટન દબાવો)!");
        return;
      }

      let note = document.getElementById('orderNote').value.trim();
      let noteText = note ? `\n📝 *ખાસ નોંધ:* ${note}` : "";

      let message = `🍽️ *DEVI COFFEE DAY - નવો ઓર્ડર*\n` +
                    `📍 *ટેબલ નંબર:* ${tableNumber}\n` +
                    `--------------------------------\n` +
                    orderItemsText +
                    `--------------------------------\n` +
                    `💰 *કુલ બિલ:* ₹${total}` +
                    noteText + `\n\n` +
                    `_ઓર્ડર કન્ફર્મ કરો._`;

      let url = `https://wa.me/${RESTAURANT_PHONE}?text=${encodeURIComponent(message)}`;
      window.open(url, '_blank');

      // Auto-reset cart after sending order
      cart = {};
      document.getElementById('orderNote').value = "";
      updateTotal();
      renderMenu();
    }

    renderMenu();
  </script>
