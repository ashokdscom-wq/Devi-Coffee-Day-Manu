  <style>
    :root {
      --primary: #33180c;
      --primary-light: #522714;
      --accent: #d4a373;
      --accent-soft: #faebd7;
      --bg: #fbf8f4;
      --card-bg: #ffffff;
      --text-dark: #271a13;
      --text-muted: #75675e;
      --border-color: #eedecf;
      --whatsapp: #25D366;
      --whatsapp-dark: #128C7E;
      --shadow: 0 4px 14px rgba(51, 24, 12, 0.07);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-dark);
      padding-bottom: 120px;
    }

    /* Header */
    .header {
      background: linear-gradient(145deg, #2b140a, #4a2313);
      color: #fff;
      padding: 20px 16px 16px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .brand-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #f7efe6;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .brand-sub {
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--accent);
      text-transform: uppercase;
      margin-top: 2px;
      font-weight: 700;
    }

    .table-badge {
      display: inline-block;
      margin-top: 8px;
      background: rgba(212, 163, 115, 0.2);
      border: 1px solid var(--accent);
      color: #fff;
      padding: 4px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
    }

    /* Search Box */
    .search-box {
      padding: 12px 16px 4px;
      max-width: 720px;
      margin: auto;
    }

    .search-box input {
      width: 100%;
      padding: 12px 18px;
      border-radius: 12px;
      border: 1.5px solid var(--border-color);
      outline: none;
      font-size: 14px;
      background: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      color: var(--text-dark);
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    /* Horizontal Category Scroller */
    .categories-nav {
      display: flex;
      overflow-x: auto;
      padding: 10px 16px;
      gap: 8px;
      scrollbar-width: none;
      max-width: 720px;
      margin: auto;
    }

    .categories-nav::-webkit-scrollbar {
      display: none;
    }

    .cat-btn {
      white-space: nowrap;
      padding: 8px 16px;
      background: #eee3d5;
      color: var(--primary);
      border: none;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .cat-btn.active {
      background: var(--primary);
      color: #fff;
    }

    /* Menu Container */
    .menu-container {
      max-width: 720px;
      margin: auto;
      padding: 6px 16px;
    }

    .section-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--primary);
      margin: 22px 0 10px;
      padding-bottom: 6px;
      border-bottom: 2px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Menu Item Card */
    .menu-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
    }

    .item-details {
      flex: 1;
      padding-right: 12px;
    }

    .item-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 3px;
    }

    .item-desc {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.35;
      margin-bottom: 6px;
    }

    .item-price {
      font-size: 15px;
      font-weight: 800;
      color: var(--primary-light);
    }

    /* Quantity Controls */
    .qty-controls {
      display: flex;
      align-items: center;
      background: #f7efe6;
      border-radius: 10px;
      padding: 4px;
      border: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .qty-btn {
      background: #fff;
      color: var(--primary);
      border: 1px solid #d8c6b5;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qty-btn:active {
      transform: scale(0.92);
      background: var(--accent);
      color: #fff;
    }

    .qty-count {
      min-width: 28px;
      text-align: center;
      font-weight: 800;
      font-size: 14px;
      color: var(--primary);
    }

    /* Note Input */
    .note-section {
      max-width: 720px;
      margin: 16px auto 0;
      padding: 0 16px;
    }

    .note-section input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1.5px solid var(--border-color);
      background: #fff;
      font-size: 13px;
      outline: none;
      color: var(--text-dark);
    }

    /* Floating Cart Bar */
    .cart-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #ffffff;
      padding: 14px 20px;
      box-shadow: 0 -5px 25px rgba(0,0,0,0.12);
      border-top: 1px solid var(--border-color);
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 720px;
      margin: auto;
    }

    .cart-info {
      display: flex;
      flex-direction: column;
    }

    .cart-items-count {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .cart-total-price {
      font-size: 20px;
      font-weight: 800;
      color: var(--primary);
    }

    .btn-whatsapp {
      background: var(--whatsapp);
      color: #ffffff;
      border: none;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37, 211, 102, 0.4);
      transition: all 0.2s;
    }

    .btn-whatsapp:active {
      background: var(--whatsapp-dark);
      transform: scale(0.96);
    }

    .btn-whatsapp svg {
      width: 20px;
      height: 20px;
      fill: #ffffff;
    }
  </style>

    let cart = {};

    // Get Table Number from URL (?table=4)
    const urlParams = new URLSearchParams(window.location.search);
    const tableNo = urlParams.get('table') || '૧';
    document.getElementById('table-display').innerText = "ટેબલ નંબર: " + tableNo;

    function renderMenu() {
      const menuContainer = document.getElementById('menuList');
      const searchKeyword = document.getElementById('searchInput').value.toLowerCase().trim();
      menuContainer.innerHTML = '';

      let filtered = menuData.filter(item => {
        let matchCat = (activeCategory === 'all' || item.cat === activeCategory);
        let matchSearch = item.name.toLowerCase().includes(searchKeyword) || item.desc.toLowerCase().includes(searchKeyword);
        return matchCat && matchSearch;
      });

      if (filtered.length === 0) {
        menuContainer.innerHTML = '<div style="text-align:center; padding: 40px 10px; color:#8c7b70; font-weight:600;">કોઈ વાનગી મળી નથી.</div>';
        return;
      }

      filtered.forEach(item => {
        let qty = cart[item.id] ? cart[item.id].qty : 0;
        let card = document.createElement('div');
        card.className = 'menu-card';
        card.innerHTML = `
          <div class="item-details">
            <div class="item-name">${item.name}</div>
            <div class="item-desc">${item.desc}</div>
            <div class="item-price">₹${item.price}</div>
          </div>
          <div class="qty-controls">
            <button class="qty-btn" onclick="updateItemQty(${item.id}, -1)">-</button>
            <span class="qty-count" id="count-${item.id}">${qty}</span>
            <button class="qty-btn" onclick="updateItemQty(${item.id}, 1)">+</button>
          </div>
        `;
        menuContainer.appendChild(card);
      });
    }

    function updateItemQty(id, delta) {
      const item = menuData.find(i => i.id === id);
      if (!cart[id]) {
        cart[id] = { ...item, qty: 0 };
      }
      cart[id].qty += delta;
      if (cart[id].qty <= 0) {
        delete cart[id];
      }

      const countEl = document.getElementById(`count-${id}`);
      if (countEl) {
        countEl.innerText = cart[id] ? cart[id].qty : 0;
      }
      updateCartSummary();
    }

    function updateCartSummary() {
      let totalQty = 0;
      let totalPrice = 0;
      for (let id in cart) {
        totalQty += cart[id].qty;
        totalPrice += cart[id].qty * cart[id].price;
      }
      document.getElementById('cartCount').innerText = `${totalQty} આઇટમ્સ સિલેક્ટ કરી`;
      document.getElementById('cartTotal').innerText = totalPrice;
    }

    function filterCategory(cat, btn) {
      activeCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderMenu();
    }

    function filterMenu() {
      renderMenu();
    }

    function sendOrderWhatsApp() {
      let total = 0;
      let orderItemsText = "";

      for (let id in cart) {
        if (cart[id].qty > 0) {
          let itemCost = cart[id].qty * cart[id].price;
          total += itemCost;
          orderItemsText += `• *${cart[id].name}* x ${cart[id].qty} = ₹${itemCost}\n`;
        }
      }

      if (orderItemsText === "") {
        alert("કૃપા કરીને મેનુમાંથી વાનગી પસંદ કરો (+ બટન દબાવો)!");
        return;
      }

      let note = document.getElementById('orderNote').value.trim();
      let noteText = note ? `\n📝 *ખાસ સૂચના:* ${note}` : "";

      let message = `🍽️ *DEVI COFFEE DAY - નવો ઓર્ડર*\n` +
                    `📍 *ટેબલ નંબર:* ${tableNo}\n` +
                    `--------------------------------\n` +
                    orderItemsText +
                    `--------------------------------\n` +
                    `💰 *કુલ રકમ: ₹${total}*` +
                    noteText + `\n\n` +
                    `_કૃપા કરીને ઓર્ડર કન્ફર્મ કરો._`;

      let waUrl = `https://wa.me/${RESTAURANT_PHONE}?text=${encodeURIComponent(message)}`;
      window.open(waUrl, '_blank');
    }

    // First render
    renderMenu();
