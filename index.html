<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DEVI COFFEE DAY - Live Smart Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2a1309;
      --primary-gradient: linear-gradient(135deg, #241108 0%, #442010 100%);
      --accent: #d4a373;
      --accent-gold: #e5b07b;
      --bg: #f8f5f0;
      --card-bg: #ffffff;
      --text-dark: #22150e;
      --text-muted: #6e5f55;
      --border-color: #eedcc9;
      --veg-green: #0f8a3c;
      --whatsapp: #25D366;
      --whatsapp-dark: #128C7E;
      --shadow-sm: 0 2px 8px rgba(42, 19, 9, 0.05);
      --shadow-md: 0 6px 18px rgba(42, 19, 9, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text-dark); padding-bottom: 140px; }

    /* Header */
    .header {
      background: var(--primary-gradient);
      color: #fff;
      padding: 16px 16px 14px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    }
    .lang-switcher {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 10px;
    }
    .lang-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(212, 163, 115, 0.4);
      color: #f7efe6;
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }
    .lang-btn.active {
      background: var(--accent-gold);
      color: var(--primary);
      border-color: var(--accent-gold);
    }

    .brand-logo-wrap {
      width: 88px;
      height: 88px;
      margin: 0 auto 8px;
      border-radius: 50%;
      background: #edd6bf;
      box-shadow: 0 4px 15px rgba(0,0,0,0.35);
      border: 2.5px solid var(--accent-gold);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      transform: scale(2.4);
    }
    .brand-title { font-size: 21px; font-weight: 800; letter-spacing: 1.5px; color: #fbf6f0; }
    .brand-sub { font-size: 10px; letter-spacing: 3px; color: var(--accent-gold); text-transform: uppercase; margin-top: 2px; font-weight: 700; }

    /* Quick Service Bar */
    .service-bar {
      max-width: 720px;
      margin: 12px auto 0;
      padding: 0 16px;
      display: flex;
      gap: 10px;
    }
    .service-btn {
      flex: 1;
      background: #fff;
      border: 1.5px solid var(--border-color);
      padding: 9px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      color: var(--primary);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Search Box */
    .search-box { padding: 12px 16px 4px; max-width: 720px; margin: auto; }
    .search-box input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 14px;
      border: 1.5px solid var(--border-color);
      outline: none;
      font-size: 14px;
      background: #fff;
      box-shadow: var(--shadow-sm);
    }

    /* Categories Navigation */
    .categories-nav {
      display: flex;
      overflow-x: auto;
      padding: 10px 16px;
      gap: 8px;
      scrollbar-width: none;
      max-width: 720px;
      margin: auto;
    }
    .categories-nav::-webkit-scrollbar { display: none; }
    .cat-btn {
      white-space: nowrap;
      padding: 8px 16px;
      background: #ede2d4;
      color: var(--primary);
      border: none;
      border-radius: 25px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }
    .cat-btn.active { background: var(--primary); color: #fff; }

    /* Menu Container */
    .menu-container { max-width: 720px; margin: auto; padding: 6px 16px; }
    .menu-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-color);
      transition: all 0.2s;
    }
    .menu-card.disabled {
      opacity: 0.6;
      background: #f0ece9;
    }
    .item-details { flex: 1; padding-right: 12px; }
    .item-top { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
    .veg-icon {
      width: 15px;
      height: 15px;
      border: 1.5px solid var(--veg-green);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 3px;
    }
    .veg-icon span { width: 7px; height: 7px; background: var(--veg-green); border-radius: 50%; }
    .item-badge {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .badge-bestseller { background: #ffe9b1; color: #8a5300; }
    .badge-special { background: #fed7d7; color: #9b1c1c; }
    .badge-outofstock { background: #e2e8f0; color: #64748b; font-weight: 800; }

    .item-name { font-size: 15px; font-weight: 800; color: var(--text-dark); }
    .item-desc { font-size: 12px; color: var(--text-muted); line-height: 1.35; margin: 3px 0 5px; }
    .item-price { font-size: 16px; font-weight: 800; color: var(--primary); }

    /* Quantity Controls */
    .qty-controls {
      display: flex;
      align-items: center;
      background: #f7efe6;
      border-radius: 12px;
      padding: 4px;
      border: 1px solid var(--border-color);
      flex-shrink: 0;
    }
    .qty-btn {
      background: #fff;
      color: var(--primary);
      border: 1px solid #dfcfbe;
      width: 32px;
      height: 32px;
      border-radius: 9px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .qty-count { min-width: 28px; text-align: center; font-weight: 800; font-size: 14px; color: var(--primary); }

    .soldout-tag {
      font-size: 12px;
      font-weight: 800;
      color: #e53e3e;
      background: #fff5f5;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid #fed7d7;
    }

    /* Note Input & Footer */
    .note-section { max-width: 720px; margin: 16px auto 0; padding: 0 16px; }
    .note-section input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 14px;
      border: 1.5px solid var(--border-color);
      background: #fff;
      font-size: 13px;
      outline: none;
    }
    .social-footer {
      max-width: 720px;
      margin: 18px auto 10px;
      text-align: center;
      padding: 0 16px;
    }
    .instagram-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #9d2d6d;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      background: #fdf0f7;
      padding: 7px 16px;
      border-radius: 20px;
      border: 1px solid #f8c8e3;
    }

    /* Floating Cart Bar */
    .cart-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #ffffff;
      padding: 12px 18px;
      box-shadow: 0 -6px 25px rgba(0,0,0,0.12);
      border-top: 1px solid var(--border-color);
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 720px;
      margin: auto;
    }
    .cart-total-price { font-size: 21px; font-weight: 800; color: var(--primary); }
    .btn-whatsapp {
      background: var(--whatsapp);
      color: #ffffff;
      border: none;
      padding: 11px 20px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="lang-switcher">
      <button class="lang-btn active" id="btn-gu" onclick="setLanguage('gu')">ગુજરાતી</button>
      <button class="lang-btn" id="btn-en" onclick="setLanguage('en')">English</button>
      <button class="lang-btn" id="btn-hi" onclick="setLanguage('hi')">हिन्दी</button>
    </div>

    <div class="brand-logo-wrap">
      <img src="logo.jpg" alt="DEVI COFFEE DAY" onerror="this.onerror=null; this.src='logo.png';">
    </div>
    <div class="brand-title">DEVI COFFEE DAY</div>
    <div class="brand-sub">Original Fresh</div>
  </header>

  <!-- Quick Service -->
  <div class="service-bar">
    <button class="service-btn" id="btnWater" onclick="sendServiceReq('water')">💧 <span id="lblWater">પાણી મંગાવો</span></button>
    <button class="service-btn" id="btnWaiter" onclick="sendServiceReq('waiter')">🛎️ <span id="lblWaiter">વેઈટર બોલાવો</span></button>
  </div>

  <!-- Search -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="🔍 મેનુમાં વાનગી શોધો..." onkeyup="renderMenu()">
  </div>

  <!-- Categories -->
  <nav class="categories-nav" id="categoryNav"></nav>

  <!-- Menu List -->
  <main class="menu-container" id="menuList">
    <div style="text-align: center; padding: 40px; color: #888;">મેનુ લોડ થઈ રહ્યું છે...</div>
  </main>

  <!-- Note Input -->
  <div class="note-section">
    <input type="text" id="orderNote" placeholder="✍️ કોઈ ખાસ નોંધ? (દા.ત. Less Spicy, Jain)">
  </div>

  <!-- Social Link -->
  <div class="social-footer">
    <a href="https://instagram.com/devicoffeeday" target="_blank" class="instagram-link">
      📸 Instagram: <b>@devicoffeeday</b>
    </a>
  </div>

  <!-- Bottom Floating Cart -->
  <footer class="cart-bar">
    <div>
      <span style="font-size:12px; color:var(--text-muted); font-weight:600;" id="cartCount">0 આઇટમ્સ સિલેક્ટ કરી</span><br>
      <span class="cart-total-price">₹<span id="cartTotal">0</span></span>
    </div>
    <button class="btn-whatsapp" onclick="sendOrderWhatsApp()">
      <span id="lblOrderBtn">WhatsApp ઓર્ડર</span> 📲
    </button>
  </footer>

  <script>
    const RESTAURANT_PHONE = "919898237900";
    const SHEET_ID = "1tmy2M5sRI8pNpvsgv_dwRXyIGitCTDlVUBDpQI2bjaU";

    const params = new URLSearchParams(window.location.search);
    const tableNumber = params.get('table') || params.get('Table') || params.get('t') || '1';

    let currentLang = 'gu';

    const UI_TRANSLATIONS = {
      gu: {
        water: "પાણી મંગાવો",
        waiter: "વેઈટર બોલાવો",
        search: "🔍 મેનુમાં વાનગી શોધો...",
        note: "✍️ કોઈ ખાસ નોંધ? (દા.ત. Less Spicy, Jain)",
        cartText: "આઇટમ્સ સિલેક્ટ કરી",
        orderBtn: "WhatsApp ઓર્ડર",
        soldOut: "હાજર નથી (Sold Out)",
        alertNoItem: "કૃપા કરીને પહેલા વાનગી પસંદ કરો (+ બટન દબાવો)!"
      },
      en: {
        water: "Order Water",
        waiter: "Call Waiter",
        search: "🔍 Search menu...",
        note: "✍️ Special instructions? (e.g. Less Spicy, Jain)",
        cartText: "items selected",
        orderBtn: "Order on WhatsApp",
        soldOut: "Sold Out",
        alertNoItem: "Please add items to cart first!"
      },
      hi: {
        water: "पानी मंगवाएं",
        waiter: "वेटर को बुलाएं",
        search: "🔍 मेनू में खोजें...",
        note: "✍️ कोई विशेष निर्देश? (उदा. Less Spicy, Jain)",
        cartText: "आइटम चुने गए",
        orderBtn: "WhatsApp ऑर्डर",
        soldOut: "उपलब्ध नहीं (Sold Out)",
        alertNoItem: "कृपया पहले आइटम चुनें (+ बटन दबाएं)!"
      }
    };

    const categoriesList = [
      { id: 'all', icon: '✨', en: 'All Items', gu: 'બધું (All)', hi: 'सभी' },
      { id: 'pizza', icon: '🍕', en: 'Pizza', gu: 'Pizza', hi: 'पिज़्ज़ा' },
      { id: 'maggi', icon: '🍜', en: 'Maggi', gu: 'Maggi', hi: 'मैगी' },
      { id: 'nachos', icon: '🧀', en: 'Nachos', gu: 'Nachos', hi: 'नाचोस' },
      { id: 'rice-bowl', icon: '🍚', en: 'Rice Bowl', gu: 'Rice Bowl', hi: 'राइस बाउल' },
      { id: 'dessert', icon: '🍨', en: 'Dessert', gu: 'Dessert', hi: 'डेज़र्ट' },
      { id: 'hot-coffee', icon: '☕', en: 'Hot Coffee', gu: 'Hot Coffee', hi: 'हॉट कॉफ़ी' },
      { id: 'hot-chocolate', icon: '🍫', en: 'Hot Chocolate', gu: 'Hot Chocolate', hi: 'हॉट चॉकलेट' },
      { id: 'cold-coffee', icon: '🥤', en: 'Cold Coffee', gu: 'Cold Coffee', hi: 'कोल्ड कॉफ़ी' },
      { id: 'ice-blended', icon: '🧊', en: 'Ice-Blended', gu: 'Ice-Blended', hi: 'आइस ब्लेंडेड' },
      { id: 'mocktails', icon: '🍹', en: 'Mocktails', gu: 'Mocktails', hi: 'मॉकटेल' },
      { id: 'thick-shakes', icon: '🥤', en: 'Thick Shakes', gu: 'Thick Shakes', hi: 'थिक शेक्स' },
      { id: 'iced-coffee', icon: '🧊', en: 'Iced Coffee', gu: 'Iced Coffee', hi: 'आइस्ड कॉफ़ी' },
      { id: 'iced-tea', icon: '🧋', en: 'Iced Tea', gu: 'Iced Tea', hi: 'आइस्ड टी' },
      { id: 'appetizers', icon: '🍟', en: 'Appetizers', gu: 'Appetizers', hi: 'स्टार्टर्स' },
      { id: 'toast', icon: '🍞', en: 'Toast', gu: 'Toast', hi: 'टोस्ट' },
      { id: 'sandwich', icon: '🥪', en: 'Sandwich', gu: 'Sandwich', hi: 'सैंडविच' },
      { id: 'club-sandwich', icon: '🥪', en: 'Club Sandwich', gu: 'Club Sandwich', hi: 'क्लब સैंडવિચ' },
      { id: 'garlic-bread', icon: '🥖', en: 'Garlic Bread', gu: 'Garlic Bread', hi: 'ગાર્લિક બ્રેડ' },
      { id: 'pasta', icon: '🍝', en: 'Pasta', gu: 'Pasta', hi: 'पास्ता' },
      { id: 'extra', icon: '➕', en: 'Extras & Drinks', gu: 'Extras & Drinks', hi: 'अन्य ड्रिंक्स' }
    ];

    let menuData = [];
    let cart = {};
    let activeCategory = 'all';

    // Google Sheet માંથી લાઈવ ડેટા મેળવવો
    async function fetchMenuFromSheet() {
      const gvizUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;
      try {
        const res = await fetch(gvizUrl);
        const text = await res.text();
        const json = JSON.parse(text.substring(47).slice(0, -2));
        const rows = json.table.rows;

        menuData = rows.map((r, index) => {
          const c = r.c;
          return {
            id: c[0] ? (c[0].v || index + 1) : index + 1,
            cat: c[1] ? String(c[1].v).toLowerCase().trim() : 'extra',
            name: c[2] ? String(c[2].v) : '',
            price: c[3] ? Number(c[3].v) : 0,
            desc: '',
            isAvailable: c[4] ? String(c[4].v).toUpperCase().trim() !== 'OFF' : true
          };
        }).filter(item => item.name !== '');

        renderCategories();
        renderMenu();
      } catch (err) {
        console.error("Error loading menu from sheet:", err);
      }
    }

    function setLanguage(lang) {
      currentLang = lang;
      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('btn-' + lang).classList.add('active');

      const t = UI_TRANSLATIONS[lang];
      document.getElementById('lblWater').innerText = t.water;
      document.getElementById('lblWaiter').innerText = t.waiter;
      document.getElementById('searchInput').placeholder = t.search;
      document.getElementById('orderNote').placeholder = t.note;
      document.getElementById('lblOrderBtn').innerText = t.orderBtn;

      renderCategories();
      renderMenu();
      updateTotal();
    }

    function renderCategories() {
      const nav = document.getElementById('categoryNav');
      nav.innerHTML = '';
      categoriesList.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'cat-btn' + (activeCategory === cat.id ? ' active' : '');
        btn.innerText = cat.icon + ' ' + (cat[currentLang] || cat.en);
        btn.onclick = () => {
          activeCategory = cat.id;
          renderCategories();
          renderMenu();
        };
        nav.appendChild(btn);
      });
    }

    function renderMenu() {
      const container = document.getElementById('menuList');
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      container.innerHTML = '';

      let filtered = menuData.filter(item => {
        let matchCat = (activeCategory === 'all' || item.cat === activeCategory);
        let matchSearch = item.name.toLowerCase().includes(q);
        return matchCat && matchSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:30px; color:#888;">કોઈ વાનગી મળી નથી.</div>`;
        return;
      }

      filtered.forEach(item => {
        let qty = cart[item.id] ? cart[item.id].qty : 0;
        let isAvailable = item.isAvailable;

        let div = document.createElement('div');
        div.className = `menu-card ${isAvailable ? '' : 'disabled'}`;
        
        let actionArea = isAvailable ? `
          <div class="qty-controls">
            <button class="qty-btn" onclick="updateQty(${item.id}, -1)">-</button>
            <span class="qty-count" id="c-${item.id}">${qty}</span>
            <button class="qty-btn" onclick="updateQty(${item.id}, 1)">+</button>
          </div>
        ` : `
          <div class="soldout-tag">${UI_TRANSLATIONS[currentLang].soldOut}</div>
        `;

        div.innerHTML = `
          <div class="item-details">
            <div class="item-top">
              <div class="veg-icon"><span></span></div>
              <div class="item-name">${item.name}</div>
            </div>
            <div class="item-price">₹${item.price}</div>
          </div>
          ${actionArea}
        `;
        container.appendChild(div);
      });
    }

    function updateQty(id, delta) {
      const item = menuData.find(i => i.id === id);
      if (!item || !item.isAvailable) return;

      if (!cart[id]) cart[id] = { ...item, qty: 0 };
      cart[id].qty += delta;
      if (cart[id].qty <= 0) delete cart[id];

      const countEl = document.getElementById(`c-${id}`);
      if (countEl) countEl.innerText = cart[id] ? cart[id].qty : 0;
      updateTotal();
    }

    function updateTotal() {
      let totalQty = 0, totalPrice = 0;
      for (let id in cart) {
        totalQty += cart[id].qty;
        totalPrice += cart[id].qty * cart[id].price;
      }
      document.getElementById('cartCount').innerText = `${totalQty} ${UI_TRANSLATIONS[currentLang].cartText}`;
      document.getElementById('cartTotal').innerText = totalPrice;
    }

    function sendServiceReq(type) {
      let serviceTitle = type === 'water' ? '💧 Water Request' : '🛎️ Call Waiter';
      let message = `🛎️ *DEVI COFFEE DAY - SERVICE REQUEST*\n` +
                    `📍 *Table Number:* ${tableNumber}\n` +
                    `📌 *Request:* ${serviceTitle}\n` +
                    `_Please attend table immediately._`;
      let url = `https://wa.me/${RESTAURANT_PHONE}?text=${encodeURIComponent(message)}`;
      window.open(url, '_blank');
    }

    function sendOrderWhatsApp() {
      let total = 0;
      let orderItemsText = "";

      for (let id in cart) {
        if (cart[id].qty > 0) {
          let itemCost = cart[id].qty * cart[id].price;
          total += itemCost;
          orderItemsText += `• *${cart[id].name}* x ${cart[id].qty} = ₹${itemCost}\n`;
        }
      }

      if (orderItemsText === "") {
        alert(UI_TRANSLATIONS[currentLang].alertNoItem);
        return;
      }

      let note = document.getElementById('orderNote').value.trim();
      let noteText = note ? `\n📝 *Note:* ${note}` : "";

      let message = `🍽️ *DEVI COFFEE DAY - NEW ORDER*\n` +
                    `📍 *Table Number:* ${tableNumber}\n` +
                    `--------------------------------\n` +
                    orderItemsText +
                    `--------------------------------\n` +
                    `💰 *Total Amount:* ₹${total}` +
                    noteText + `\n\n` +
                    `_Please confirm the order._`;

      let url = `https://wa.me/${RESTAURANT_PHONE}?text=${encodeURIComponent(message)}`;
      window.open(url, '_blank');

      cart = {};
      document.getElementById('orderNote').value = "";
      updateTotal();
      renderMenu();
    }

    fetchMenuFromSheet();
  </script>
</body>
</html>
