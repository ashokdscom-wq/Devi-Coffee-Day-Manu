    .cat-btn { white-space: nowrap; padding: 8px 16px; background: #eee3d5; color: var(--primary); border: none; border-radius: 20px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .cat-btn.active { background: var(--primary); color: #fff; }
    .menu-container { max-width: 720px; margin: auto; padding: 6px 16px; }

    .item-name { font-size: 15px; font-weight: 700; margin-bottom: 3px; }
    .item-desc { font-size: 12px; color: var(--text-muted); line-height: 1.35; margin-bottom: 6px; }
    .item-price { font-size: 15px; font-weight: 800; color: var(--primary-light); }
    .qty-controls { display: flex; align-items: center; background: #f7efe6; border-radius: 10px; padding: 4px; border: 1px solid var(--border-color); flex-shrink: 0; }
    .qty-btn { background: #fff; color: var(--primary); border: 1px solid #d8c6b5; width: 32px; height: 32px; border-radius: 8px; font-size: 16px; font-weight: 800; cursor: pointer; }

    let cart = {};
    let activeCategory = 'all';

    function renderMenu() {
      const container = document.getElementById('menuList');
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      container.innerHTML = '';

      let filtered = menuData.filter(item => {
        let matchCat = (activeCategory === 'all' || item.cat === activeCategory);
        let matchSearch = item.name.toLowerCase().includes(q) || item.desc.toLowerCase().includes(q);
        return matchCat && matchSearch;
      });

      filtered.forEach(item => {
        let qty = cart[item.id] ? cart[item.id].qty : 0;
        let div = document.createElement('div');
        div.className = 'menu-card';
        div.innerHTML = `
          <div class="item-details">
            <div class="item-name">${item.name}</div>
            <div class="item-desc">${item.desc}</div>
            <div class="item-price">₹${item.price}</div>
          </div>
          <div class="qty-controls">
            <button class="qty-btn" onclick="updateQty(${item.id}, -1)">-</button>
            <span class="qty-count" id="c-${item.id}">${qty}</span>
            <button class="qty-btn" onclick="updateQty(${item.id}, 1)">+</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function updateQty(id, delta) {
      const item = menuData.find(i => i.id === id);
      if (!cart[id]) cart[id] = { ...item, qty: 0 };
      cart[id].qty += delta;
      if (cart[id].qty <= 0) delete cart[id];

      const countEl = document.getElementById(`c-${id}`);
      if (countEl) countEl.innerText = cart[id] ? cart[id].qty : 0;
      updateTotal();
    }

    function updateTotal() {
      let totalQty = 0, totalPrice = 0;
      for (let id in cart) {
        totalQty += cart[id].qty;
        totalPrice += cart[id].qty * cart[id].price;
      }
      document.getElementById('cartCount').innerText = `${totalQty} આઇટમ્સ`;
      document.getElementById('cartTotal').innerText = totalPrice;
    }

    function filterCategory(cat, btn) {
      activeCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderMenu();
    }

    function sendOrderWhatsApp() {
      let total = 0;
      let orderItemsText = "";

      for (let id in cart) {
        if (cart[id].qty > 0) {
          let itemCost = cart[id].qty * cart[id].price;
          total += itemCost;
          orderItemsText += `• *${cart[id].name}* x ${cart[id].qty} = ₹${itemCost}\n`;
        }
      }

      if (orderItemsText === "") {
        alert("કૃપા કરીને પહેલા વાનગી પસંદ કરો (+ બટન દબાવો)!");
        return;
      }

      let note = document.getElementById('orderNote').value.trim();
      let noteText = note ? `\n📝 *નોંધ:* ${note}` : "";

      let message = `🍽️ *DEVI COFFEE DAY - નવો ઓર્ડર*\n` +
                    `📍 *ટેબલ નંબર:* ${tableNumber}\n` +
                    `--------------------------------\n` +
                    orderItemsText +
                    `--------------------------------\n` +
                    `💰 *કુલ બિલ:* ₹${total}` +
                    noteText + `\n\n` +
                    `_ઓર્ડર કન્ફર્મ કરો._`;

      let url = `https://wa.me/${RESTAURANT_PHONE}?text=${encodeURIComponent(message)}`;
      
      // WhatsApp ખોલો
      window.open(url, '_blank');

      // ઓર્ડર મોકલ્યા પછી કાર્ટ અને નોટ તરત જ ક્લિયર/રીસેટ થઈ જશે
      cart = {};
      document.getElementById('orderNote').value = "";
      updateTotal();
      renderMenu();
    }

    renderMenu();
  </script>
