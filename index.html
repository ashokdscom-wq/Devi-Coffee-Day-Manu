<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DEVI COFFEE DAY - Digital Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1f0d05;
      --accent-gold: #e5b07b;
      --bg: #f9f6f0;
      --card-bg: #ffffff;
      --text-dark: #1a1a1a;
      --text-muted: #5c5249;
      --border-color: #e5d5c5;
      --veg-green: #0d8235;
      --whatsapp: #25D366;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text-dark); padding-bottom: 140px; }

    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 16px 16px 16px;
      text-align: center;
      color: #fff;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.35);
      min-height: 220px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .header-bg-slider {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 1;
      background: #1f0d05;
    }
    .slide-img {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }
    .slide-img.active { opacity: 1; }

    .header-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.25) 50%, rgba(0,0,0,0.75) 100%);
      z-index: 2;
    }

    .header-content { position: relative; z-index: 3; }

    .lang-switcher {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .lang-btn {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #ffffff;
      padding: 4px 13px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(6px);
    }
    .lang-btn.active {
      background: var(--accent-gold);
      color: var(--primary);
      border-color: var(--accent-gold);
    }

    .brand-logo-wrap {
      width: 90px;
      height: 90px;
      margin: 0 auto 8px;
      border-radius: 50%;
      background: #eedcc9;
      border: 2.5px solid var(--accent-gold);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.7);
    }
    .brand-logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scale(2.4);
    }

    .brand-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
    }
    .brand-sub {
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--accent-gold);
      text-transform: uppercase;
      margin-top: 2px;
      font-weight: 800;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9);
    }

    .service-bar {
      max-width: 720px;
      margin: 12px auto 0;
      padding: 0 16px;
      display: flex;
      gap: 10px;
    }
    .service-btn {
      flex: 1;
      background: #ffffff;
      border: 1.5px solid var(--border-color);
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      color: var(--primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }

    .search-box { padding: 12px 16px 4px; max-width: 720px; margin: auto; }
    .search-box input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1.5px solid var(--border-color);
      outline: none;
      font-size: 14px;
      background: #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }

    .categories-nav {
      display: flex;
      overflow-x: auto;
      padding: 10px 16px;
      gap: 8px;
      scrollbar-width: none;
      max-width: 720px;
      margin: auto;
    }
    .categories-nav::-webkit-scrollbar { display: none; }
    .cat-btn {
      white-space: nowrap;
      padding: 8px 16px;
      background: #eae0d5;
      color: var(--primary);
      border: none;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .cat-btn.active { background: var(--primary); color: #ffffff; }

    .menu-container { max-width: 720px; margin: auto; padding: 6px 16px; }
    .menu-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1.5px solid var(--border-color);
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    .menu-card.disabled {
      opacity: 0.55;
      background: #f1ece7;
    }
    .item-details { flex: 1; padding-right: 12px; }
    .item-top { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
    .veg-icon {
      width: 15px;
      height: 15px;
      border: 1.5px solid var(--veg-green);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .veg-icon span { width: 7px; height: 7px; background: var(--veg-green); border-radius: 50%; }
    .item-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 6px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .badge-bestseller { background: #fff1d6; color: #8a5300; }
    .badge-special { background: #fee2e2; color: #991b1b; }

    .item-name { font-size: 15px; font-weight: 700; color: #111111; }
    .item-desc { font-size: 12px; color: var(--text-muted); line-height: 1.35; margin: 3px 0 5px; }
    .item-price { font-size: 16px; font-weight: 800; color: var(--primary); }

    .qty-controls {
      display: flex;
      align-items: center;
      background: #f7efe6;
      border-radius: 10px;
      padding: 3px;
      border: 1px solid var(--border-color);
      flex-shrink: 0;
    }
    .qty-btn {
      background: #ffffff;
      color: var(--primary);
      border: 1px solid #d9c7b5;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .qty-count { min-width: 26px; text-align: center; font-weight: 800; font-size: 14px; color: var(--primary); }
    .soldout-tag {
      font-size: 11px;
      font-weight: 800;
      color: #dc2626;
      background: #fef2f2;
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid #fecaca;
    }

    .note-section { max-width: 720px; margin: 16px auto 0; padding: 0 16px; }
    .note-section input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1.5px solid var(--border-color);
      background: #ffffff;
      font-size: 13px;
      outline: none;
    }
    .social-footer {
      max-width: 720px;
      margin: 18px auto 10px;
      text-align: center;
      padding: 0 16px;
    }
    .instagram-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #9d2d6d;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      background: #fdf0f7;
      padding: 7px 16px;
      border-radius: 20px;
      border: 1px solid #f8c8e3;
    }

    .cart-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #ffffff;
      padding: 12px 18px;
      box-shadow: 0 -4px 15px rgba(0,0,0,0.1);
      border-top: 1.5px solid var(--border-color);
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 720px;
      margin: auto;
    }
    .cart-total-price { font-size: 20px; font-weight: 800; color: var(--primary); }
    .btn-whatsapp {
      background: var(--whatsapp);
      color: #ffffff;
      border: none;
      padding: 11px 20px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(37, 211, 102, 0.3);
    }
    .loader-text {
      text-align: center;
      padding: 30px;
      font-weight: 700;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-bg-slider" id="bgSlider">
      <div class="slide-img active" style="background-image: url('banner1.jpg'), url('https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?w=800');"></div>
      <div class="slide-img" style="background-image: url('banner2.jpg'), url('https://images.unsplash.com/photo-1513104890138-7c749659a591?w=800');"></div>
      <div class="slide-img" style="background-image: url('banner3.jpg'), url('https://images.unsplash.com/photo-1541167760496-1628856ab772?w=800');"></div>
      <div class="slide-img" style="background-image: url('banner4.jpg');"></div>
      <div class="slide-img" style="background-image: url('banner5.jpg');"></div>
      <div class="slide-img" style="background-image: url('banner6.jpg');"></div>
      <div class="slide-img" style="background-image: url('banner7.jpg');"></div>
      <div class="slide-img" style="background-image: url('banner8.jpg');"></div>
      <div class="slide-img" style="background-image: url('banner9.jpg');"></div>
      <div class="slide-img" style="background-image: url('banner10.jpg');"></div>
      <div class="slide-img" style="background-image: url('banner11.jpg');"></div>
      <div class="slide-img" style="background-image: url('banner12.jpg');"></div>
      <div class="slide-img" style="background-image: url('banner13.jpg');"></div>

    <div class="header-overlay"></div>

    <div class="header-content">

  </header>

  <div class="service-bar">
    <button class="service-btn" onclick="sendServiceReq('water')">💧 <span id="lblWater">પાણી મંગાવો</span></button>
    <button class="service-btn" onclick="sendServiceReq('waiter')">🛎️ <span id="lblWaiter">વેઈટર બોલાવો</span></button>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="🔍 મેનુમાં વાનગી શોધો..." onkeyup="renderMenu()">
  </div>

  <nav class="categories-nav" id="categoryNav"></nav>

  <main class="menu-container" id="menuList">
    <div class="loader-text">મેનુ લોડ થઈ રહ્યું છે...</div>

  <div class="note-section">
    <input type="text" id="orderNote" placeholder="✍️ કોઈ ખાસ નોંધ? (દા.ત. Less Spicy, Jain)">

  <div class="social-footer">
    <a href="https://instagram.com/devicoffeeday" target="_blank" class="instagram-link">
      📸 Instagram: <b>@devicoffeeday</b>

  </div>

  <footer class="cart-bar">
    <div>
      <span style="font-size:12px; color:var(--text-muted); font-weight:600;" id="cartCount">0 આઇટમ્સ સિલેક્ટ કરી</span><br>
      <span class="cart-total-price">₹<span id="cartTotal">0</span></span>

      <span id="lblOrderBtn">ઓર્ડર કરો</span> 📲
    </button>
  </footer>

  <script>
    const RESTAURANT_PHONE = "919898237900";
    const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1tmy2M5sRI8pNpvsgv_dwRXyIGitCTDlVUBDpQI2bjaU/export?format=csv";
    const GOOGLE_SCRIPT_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwO0a9quduWuBC6W_0b4iQrsKur5pxchTCfFdHLV59Bo65U540EBMeckblpaTdSlhNc/exec";

    const params = new URLSearchParams(window.location.search);
    const tableNumber = params.get('table') || params.get('Table') || params.get('t') || '1';

    let currentLang = 'gu';

    const bgSlides = Array.from(document.querySelectorAll('.slide-img'));
    let currentBgIdx = 0;

    setInterval(() => {
      if (bgSlides.length <= 1) return;
      bgSlides[currentBgIdx].classList.remove('active');
      currentBgIdx = (currentBgIdx + 1) % bgSlides.length;
      bgSlides[currentBgIdx].classList.add('active');
    }, 3000);

    const UI_TRANSLATIONS = {
      gu: {
        water: "પાણી મંગાવો",
        waiter: "વેઈટર બોલાવો",
        search: "🔍 મેનુમાં વાનગી શોધો...",
        note: "✍️ કોઈ ખાસ નોંધ? (દા.ત. Less Spicy, Jain)",
        cartText: "આઇટમ્સ સિલેક્ટ કરી",
        orderBtn: "ઓર્ડર કરો",
        soldOut: "હાજર નથી (Sold Out)",
        alertNoItem: "કૃપા કરીને પહેલા વાનગી પસંદ કરો (+ બટન દબાવો)!"
      },
      en: {
        water: "Order Water",
        waiter: "Call Waiter",
        search: "🔍 Search menu...",
        note: "✍️ Special instructions? (e.g. Less Spicy, Jain)",
        cartText: "items selected",
        orderBtn: "Place Order",
        soldOut: "Sold Out",
        alertNoItem: "Please add items to cart first!"
      },
      hi: {
        water: "पानी मंगवाएं",
        waiter: "वेटर को बुलाएं",
        search: "🔍 मेनू में खोजें...",
        note: "✍️ कोई विशेष निर्देश? (उदा. Less Spicy, Jain)",
        cartText: "आइटम चुने गए",
        orderBtn: "ऑर्डर करें",
        soldOut: "उपलब्ध नहीं (Sold Out)",
        alertNoItem: "कृपया पहले आइटम चुनें (+ बटन दबाएं)!"
      }
    };

    const categoriesList = [
      { id: 'all', icon: '✨', en: 'All Items', gu: 'બધું (All)', hi: 'सभी' },
      { id: 'pizza', icon: '🍕', en: 'Pizza', gu: 'Pizza', hi: 'पिज़्ज़ा' },
      { id: 'maggi', icon: '🍜', en: 'Maggi', gu: 'Maggi', hi: 'मैगी' },
      { id: 'nachos', icon: '🧀', en: 'Nachos', gu: 'Nachos', hi: 'नाचोस' },
      { id: 'rice-bowl', icon: '🍚', en: 'Rice Bowl', gu: 'Rice Bowl', hi: 'રાઇસ બાઉલ' },
      { id: 'dessert', icon: '🍨', en: 'Dessert', gu: 'Dessert', hi: 'ડેઝર્ટ' },
      { id: 'hot-coffee', icon: '☕', en: 'Hot Coffee', gu: 'Hot Coffee', hi: 'હોટ કોફી' },
      { id: 'hot-chocolate', icon: '🍫', en: 'Hot Chocolate', gu: 'Hot Chocolate', hi: 'હોટ ચોકલેટ' },
      { id: 'cold-coffee', icon: '🥤', en: 'Cold Coffee', gu: 'Cold Coffee', hi: 'કોલ્ડ કોફી' },
      { id: 'ice-blended', icon: '🧊', en: 'Ice-Blended', gu: 'Ice-Blended', hi: 'આઇસ બ્લેન્ડેડ' },
      { id: 'mocktails', icon: '🍹', en: 'Mocktails', gu: 'Mocktails', hi: 'મોકટેલ' },
      { id: 'thick-shakes', icon: '🥤', en: 'Thick Shakes', gu: 'Thick Shakes', hi: 'થિક શેક્સ' },
      { id: 'iced-coffee', icon: '🧊', en: 'Iced Coffee', gu: 'Iced Coffee', hi: 'આઇસ્ડ કોફી' },
      { id: 'iced-tea', icon: '🧋', en: 'Iced Tea', gu: 'Iced Tea', hi: 'આઇસ્ડ ટી' },
      { id: 'appetizers', icon: '🍟', en: 'Appetizers', gu: 'Appetizers', hi: 'સ્ટાર્ટર્સ' },
      { id: 'toast', icon: '🍞', en: 'Toast', gu: 'Toast', hi: 'ટોસ્ટ' },
      { id: 'sandwich', icon: '🥪', en: 'Sandwich', gu: 'Sandwich', hi: 'સેન્ડવિચ' },
      { id: 'club-sandwich', icon: '🥪', en: 'Club Sandwich', gu: 'Club Sandwich', hi: 'ક્લબ સેન્ડવિચ' },
      { id: 'garlic-bread', icon: '🥖', en: 'Garlic Bread', gu: 'Garlic Bread', hi: 'ગાર્લિક બ્રેડ' },
      { id: 'pasta', icon: '🍝', en: 'Pasta', gu: 'Pasta', hi: 'પાસ્તા' },
      { id: 'extra', icon: '➕', en: 'Extras & Drinks', gu: 'Extras & Drinks', hi: 'અન્ય ડ્રિંક્સ' }
    ];

    let menuData = [];
    let cart = {};
    let activeCategory = 'all';

    function parseCSVLine(text) {
      let result = [];
      let row = [''];
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        let c = text[i];
        let next = text[i+1];
        if (c === '"') {
          if (inQuotes && next === '"') {
            row[row.length - 1] += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (c === ',' && !inQuotes) {
          row.push('');
        } else {
          row[row.length - 1] += c;
        }
      }
      return row;
    }

    async function loadLiveMenu() {
      try {
        const liveURL = GOOGLE_SHEET_CSV_URL + '&t=' + Date.now();
        const res = await fetch(liveURL);
        const csvText = await res.text();
        const lines = csvText.split(/\r?\n/).filter(line => line.trim() !== '');

        if (lines.length > 1) {
          let parsedData = [];
          const rows = lines.slice(1);

          rows.forEach((row, idx) => {
            const cols = parseCSVLine(row);
            if (cols.length >= 5) {
              const id = parseInt(cols[0]?.trim()) || (idx + 1);
              const cat = cols[1]?.trim().toLowerCase() || 'extra';
              const name = cols[2]?.trim() || '';
              const price = parseFloat(cols[3]?.trim()) || 0;
              const status = cols[4] ? cols[4].trim().toLowerCase() : 'on';

              if (name !== '') {
                parsedData.push({
                  id: id,
                  cat: cat,
                  name: name,
                  price: price,
                  desc: '',
                  isAvailable: (status === 'on' || status === '')
                });
              }
            }
          });

          if (parsedData.length > 0) {
            menuData = parsedData;
            renderMenu();
          }
        }
      } catch (err) {
        console.error("લાઈવ શીટ લોડ કરવામાં ભૂલ:", err);
      }
    }

    function setLanguage(lang) {
      currentLang = lang;
      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('btn-' + lang).classList.add('active');

      const t = UI_TRANSLATIONS[lang];
      document.getElementById('lblWater').innerText = t.water;
      document.getElementById('lblWaiter').innerText = t.waiter;
      document.getElementById('searchInput').placeholder = t.search;
      document.getElementById('orderNote').placeholder = t.note;
      document.getElementById('lblOrderBtn').innerText = t.orderBtn;

      renderCategories();
      renderMenu();
      updateTotal();
    }

    function renderCategories() {
      const nav = document.getElementById('categoryNav');
      nav.innerHTML = '';
      categoriesList.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'cat-btn' + (activeCategory === cat.id ? ' active' : '');
        btn.innerText = cat.icon + ' ' + (cat[currentLang] || cat.en);
        btn.onclick = () => {
          activeCategory = cat.id;
          renderCategories();
          renderMenu();
        };
        nav.appendChild(btn);
      });
    }

    function renderMenu() {
      const container = document.getElementById('menuList');
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      container.innerHTML = '';

      if (menuData.length === 0) {
        container.innerHTML = '<div class="loader-text">મેનુ લોડ થઈ રહ્યું છે...</div>';
        return;
      }

      let filtered = menuData.filter(item => {
        let matchCat = (activeCategory === 'all' || item.cat === activeCategory);
        let matchSearch = item.name.toLowerCase().includes(q) || (item.desc && item.desc.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div class="loader-text">કોઈ વાનગી મળી નથી.</div>';
        return;
      }

      filtered.forEach(item => {
        let qty = cart[item.id] ? cart[item.id].qty : 0;
        let badgeHtml = '';
        if (item.badge === 'bestseller') badgeHtml = '<span class="item-badge badge-bestseller">★ Bestseller</span>';
        if (item.badge === 'special') badgeHtml = '<span class="item-badge badge-special">✦ Special</span>';

        let div = document.createElement('div');
        div.className = `menu-card ${item.isAvailable ? '' : 'disabled'}`;
        
        let actionArea = item.isAvailable ? `
          <div class="qty-controls">
            <button class="qty-btn" onclick="updateQty(${item.id}, -1)">-</button>
            <span class="qty-count" id="c-${item.id}">${qty}</span>
            <button class="qty-btn" onclick="updateQty(${item.id}, 1)">+</button>
          </div>
        ` : `
          <div class="soldout-tag">${UI_TRANSLATIONS[currentLang].soldOut}</div>
        `;

        div.innerHTML = `
          <div class="item-details">
            <div class="item-top">
              <div class="veg-icon"><span></span></div>
              ${badgeHtml}
              <div class="item-name">${item.name}</div>
            </div>
            ${item.desc ? `<div class="item-desc">${item.desc}</div>` : ''}
            <div class="item-price">₹${item.price}</div>
          </div>
          ${actionArea}
        `;
        container.appendChild(div);
      });
    }

    function updateQty(id, delta) {
      const item = menuData.find(i => i.id === id);
      if (!item || !item.isAvailable) return;

      if (!cart[id]) cart[id] = { ...item, qty: 0 };
      cart[id].qty += delta;
      if (cart[id].qty <= 0) delete cart[id];

      const countEl = document.getElementById(`c-${id}`);
      if (countEl) countEl.innerText = cart[id] ? cart[id].qty : 0;
      updateTotal();
    }

    function updateTotal() {
      let totalQty = 0, totalPrice = 0;
      for (let id in cart) {
        totalQty += cart[id].qty;
        totalPrice += cart[id].qty * cart[id].price;
      }
      document.getElementById('cartCount').innerText = `${totalQty} ${UI_TRANSLATIONS[currentLang].cartText}`;
      document.getElementById('cartTotal').innerText = totalPrice;
    }

    function sendServiceReq(type) {
      let serviceTitle = type === 'water' ? '💧 Water Request' : '🛎️ Call Waiter';

      const logUrl = GOOGLE_SCRIPT_WEBAPP_URL + 
        `?table=${encodeURIComponent("Table " + tableNumber)}` +
        `&items=${encodeURIComponent(serviceTitle)}` +
        `&total=-` +
        `&note=${encodeURIComponent("Service Call")}`;
      new Image().src = logUrl;

      let message = `🛎️ *DEVI COFFEE DAY - SERVICE REQUEST*\n` +
                    `📍 *Table Number:* ${tableNumber}\n` +
                    `📌 *Request:* ${serviceTitle}\n` +
                    `_Please attend table immediately._`;
      let url = `https://wa.me/${RESTAURANT_PHONE}?text=${encodeURIComponent(message)}`;
      
      setTimeout(() => {
        window.open(url, '_blank');
      }, 200);
    }

    async function sendOrderWhatsApp() {
      let total = 0;
      let orderItemsText = "";
      let orderSummaryForSheet = [];

      for (let id in cart) {
        if (cart[id].qty > 0) {
          let itemCost = cart[id].qty * cart[id].price;
          total += itemCost;
          orderItemsText += `• *${cart[id].name}* x ${cart[id].qty} = ₹${itemCost}\n`;
          orderSummaryForSheet.push(`${cart[id].name} (x${cart[id].qty})`);
        }
      }

      if (orderItemsText === "") {
        alert(UI_TRANSLATIONS[currentLang].alertNoItem);
        return;
      }

      let note = document.getElementById('orderNote').value.trim();
      let noteText = note ? `\n📝 *Note:* ${note}` : "";

      const logUrl = GOOGLE_SCRIPT_WEBAPP_URL + 
        `?table=${encodeURIComponent("Table " + tableNumber)}` +
        `&items=${encodeURIComponent(orderSummaryForSheet.join(", "))}` +
        `&total=${encodeURIComponent("₹" + total)}` +
        `&note=${encodeURIComponent(note || "-")}`;

      try {
        await fetch(logUrl, { mode: 'no-cors' });
      } catch (e) {
        console.log(e);
      }

      let message = `🍽️ *DEVI COFFEE DAY - NEW ORDER*\n` +
                    `📍 *Table Number:* ${tableNumber}\n` +
                    `--------------------------------\n` +
                    orderItemsText +
                    `--------------------------------\n` +
                    `💰 *Total Amount:* ₹${total}` +
                    noteText + `\n\n` +
                    `_Please confirm the order._`;

      let url = `https://wa.me/${RESTAURANT_PHONE}?text=${encodeURIComponent(message)}`;
      
      setTimeout(() => {
        window.open(url, '_blank');
        cart = {};
        document.getElementById('orderNote').value = "";
        updateTotal();
        renderMenu();
      }, 400);
    }

    renderCategories();
    loadLiveMenu();
  </script>
</body>
</html>
