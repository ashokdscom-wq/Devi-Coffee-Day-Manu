    :root {
      --primary: #2a1309;
      --primary-gradient: linear-gradient(135deg, #241108 0%, #442010 100%);
      --accent: #d4a373;
      --accent-gold: #e5b07b;
      --bg: #f8f5f0;
      --card-bg: #ffffff;
      --text-dark: #22150e;
      --text-muted: #6e5f55;
      --border-color: #eedcc9;
      --veg-green: #0f8a3c;
      --whatsapp: #25D366;
      --whatsapp-dark: #128C7E;
      --shadow-sm: 0 2px 8px rgba(42, 19, 9, 0.05);
      --shadow-md: 0 6px 18px rgba(42, 19, 9, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text-dark); padding-bottom: 140px; }

    /* Header */
    .header {
      background: var(--primary-gradient);
      color: #fff;
      padding: 16px 16px 14px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    }
    .lang-switcher {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 10px;
    }
    .lang-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(212, 163, 115, 0.4);
      color: #f7efe6;
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }
    .lang-btn.active {
      background: var(--accent-gold);
      color: var(--primary);
      border-color: var(--accent-gold);
    }
    .brand-logo-wrap {
      width: 74px;
      height: 74px;
      margin: 0 auto 6px;
      border-radius: 50%;
      background: #edd6bf;
      padding: 2px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
      border: 2px solid var(--accent-gold);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-logo-wrap svg { width: 100%; height: 100%; border-radius: 50%; }
    .brand-title { font-size: 21px; font-weight: 800; letter-spacing: 1.5px; color: #fbf6f0; }
    .brand-sub { font-size: 10px; letter-spacing: 3px; color: var(--accent-gold); text-transform: uppercase; margin-top: 2px; font-weight: 700; }

    /* Quick Service Bar */
    .service-bar {
      max-width: 720px;
      margin: 12px auto 0;
      padding: 0 16px;
      display: flex;
      gap: 10px;
    }
    .service-btn {
      flex: 1;
      background: #fff;
      border: 1.5px solid var(--border-color);
      padding: 9px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      color: var(--primary);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Search Box */
    .search-box { padding: 12px 16px 4px; max-width: 720px; margin: auto; }
    .search-box input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 14px;
      border: 1.5px solid var(--border-color);
      outline: none;
      font-size: 14px;
      background: #fff;
      box-shadow: var(--shadow-sm);
    }

    /* Categories Navigation */
    .categories-nav {
      display: flex;
      overflow-x: auto;
      padding: 10px 16px;
      gap: 8px;
      scrollbar-width: none;
      max-width: 720px;
      margin: auto;
    }
    .categories-nav::-webkit-scrollbar { display: none; }
    .cat-btn {
      white-space: nowrap;
      padding: 8px 16px;
      background: #ede2d4;
      color: var(--primary);
      border: none;
      border-radius: 25px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }
    .cat-btn.active { background: var(--primary); color: #fff; }

    /* Menu Container */
    .menu-container { max-width: 720px; margin: auto; padding: 6px 16px; }
    .menu-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-color);
    }
    .item-details { flex: 1; padding-right: 12px; }
    .item-top { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
    .veg-icon {
      width: 15px;
      height: 15px;
      border: 1.5px solid var(--veg-green);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 3px;
    }
    .veg-icon span { width: 7px; height: 7px; background: var(--veg-green); border-radius: 50%; }
    .item-badge {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .badge-bestseller { background: #ffe9b1; color: #8a5300; }
    .badge-special { background: #fed7d7; color: #9b1c1c; }
    .item-name { font-size: 15px; font-weight: 800; color: var(--text-dark); }
    .item-desc { font-size: 12px; color: var(--text-muted); line-height: 1.35; margin: 3px 0 5px; }
    .item-price { font-size: 16px; font-weight: 800; color: var(--primary); }

    /* Quantity Controls */
    .qty-controls {
      display: flex;
      align-items: center;
      background: #f7efe6;
      border-radius: 12px;
      padding: 4px;
      border: 1px solid var(--border-color);
      flex-shrink: 0;
    }
    .qty-btn {
      background: #fff;
      color: var(--primary);
      border: 1px solid #dfcfbe;
      width: 32px;
      height: 32px;
      border-radius: 9px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .qty-count { min-width: 28px; text-align: center; font-weight: 800; font-size: 14px; color: var(--primary); }

    /* Note Input & Footer */
    .note-section { max-width: 720px; margin: 16px auto 0; padding: 0 16px; }
    .note-section input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 14px;
      border: 1.5px solid var(--border-color);
      background: #fff;
      font-size: 13px;
      outline: none;
    }
    .social-footer {
      max-width: 720px;
      margin: 18px auto 10px;
      text-align: center;
      padding: 0 16px;
    }
    .instagram-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #9d2d6d;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      background: #fdf0f7;
      padding: 7px 16px;
      border-radius: 20px;
      border: 1px solid #f8c8e3;
    }

    /* Floating Cart Bar */
    .cart-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #ffffff;
      padding: 12px 18px;
      box-shadow: 0 -6px 25px rgba(0,0,0,0.12);
      border-top: 1px solid var(--border-color);
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 720px;
      margin: auto;

      align-items: center;

    let cart = {};
    let activeCategory = 'all';

    function setLanguage(lang) {
      currentLang = lang;
      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('btn-' + lang).classList.add('active');

      const t = UI_TRANSLATIONS[lang];
      document.getElementById('lblWater').innerText = t.water;
      document.getElementById('lblWaiter').innerText = t.waiter;
      document.getElementById('searchInput').placeholder = t.search;
      document.getElementById('orderNote').placeholder = t.note;
      document.getElementById('lblOrderBtn').innerText = t.orderBtn;

      renderCategories();
      renderMenu();
      updateTotal();
    }

    function renderCategories() {
      const nav = document.getElementById('categoryNav');
      nav.innerHTML = '';
      categoriesList.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'cat-btn' + (activeCategory === cat.id ? ' active' : '');
        btn.innerText = cat.icon + ' ' + (cat[currentLang] || cat.en);
        btn.onclick = () => {
          activeCategory = cat.id;
          renderCategories();
          renderMenu();
        };
        nav.appendChild(btn);
      });
    }

    function renderMenu() {
      const container = document.getElementById('menuList');
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      container.innerHTML = '';

      let filtered = menuData.filter(item => {
        let matchCat = (activeCategory === 'all' || item.cat === activeCategory);
        let matchSearch = item.name.toLowerCase().includes(q) || item.desc.toLowerCase().includes(q);
        return matchCat && matchSearch;
      });

      filtered.forEach(item => {
        let qty = cart[item.id] ? cart[item.id].qty : 0;
        let badgeHtml = '';
        if (item.badge === 'bestseller') badgeHtml = '<span class="item-badge badge-bestseller">★ Bestseller</span>';
        if (item.badge === 'special') badgeHtml = '<span class="item-badge badge-special">✦ Special</span>';

        let div = document.createElement('div');
        div.className = 'menu-card';
        div.innerHTML = `
          <div class="item-details">
            <div class="item-top">
              <div class="veg-icon"><span></span></div>
              ${badgeHtml}
              <div class="item-name">${item.name}</div>
            </div>
            <div class="item-desc">${item.desc}</div>
            <div class="item-price">₹${item.price}</div>
          </div>
          <div class="qty-controls">
            <button class="qty-btn" onclick="updateQty(${item.id}, -1)">-</button>
            <span class="qty-count" id="c-${item.id}">${qty}</span>
            <button class="qty-btn" onclick="updateQty(${item.id}, 1)">+</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function updateQty(id, delta) {
      const item = menuData.find(i => i.id === id);
      if (!cart[id]) cart[id] = { ...item, qty: 0 };
      cart[id].qty += delta;
      if (cart[id].qty <= 0) delete cart[id];

      const countEl = document.getElementById(`c-${id}`);
      if (countEl) countEl.innerText = cart[id] ? cart[id].qty : 0;
      updateTotal();
    }

    function updateTotal() {
      let totalQty = 0, totalPrice = 0;
      for (let id in cart) {
        totalQty += cart[id].qty;
        totalPrice += cart[id].qty * cart[id].price;
      }
      document.getElementById('cartCount').innerText = `${totalQty} ${UI_TRANSLATIONS[currentLang].cartText}`;
      document.getElementById('cartTotal').innerText = totalPrice;
    }

    function sendServiceReq(type) {
      let serviceTitle = type === 'water' ? '💧 Water Request' : '🛎️ Call Waiter';
      let message = `🛎️ *DEVI COFFEE DAY - SERVICE REQUEST*\n` +
                    `📍 *Table Number:* ${tableNumber}\n` +
                    `📌 *Request:* ${serviceTitle}\n` +
                    `_Please attend table immediately._`;
      let url = `https://wa.me/${RESTAURANT_PHONE}?text=${encodeURIComponent(message)}`;
      window.open(url, '_blank');
    }

    function sendOrderWhatsApp() {
      let total = 0;
      let orderItemsText = "";

      for (let id in cart) {
        if (cart[id].qty > 0) {
          let itemCost = cart[id].qty * cart[id].price;
          total += itemCost;
          orderItemsText += `• *${cart[id].name}* x ${cart[id].qty} = ₹${itemCost}\n`;
        }
      }

      if (orderItemsText === "") {
        alert(UI_TRANSLATIONS[currentLang].alertNoItem);
        return;
      }

      let note = document.getElementById('orderNote').value.trim();
      let noteText = note ? `\n📝 *Note:* ${note}` : "";

      let message = `🍽️ *DEVI COFFEE DAY - NEW ORDER*\n` +
                    `📍 *Table Number:* ${tableNumber}\n` +
                    `--------------------------------\n` +
                    orderItemsText +
                    `--------------------------------\n` +
                    `💰 *Total Amount:* ₹${total}` +
                    noteText + `\n\n` +
                    `_Please confirm the order._`;

      let url = `https://wa.me/${RESTAURANT_PHONE}?text=${encodeURIComponent(message)}`;
      window.open(url, '_blank');

      cart = {};
      document.getElementById('orderNote').value = "";
      updateTotal();
      renderMenu();
    }

    renderCategories();
    renderMenu();
  </script>
