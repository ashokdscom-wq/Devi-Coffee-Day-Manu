<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Order (Bill)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      min-height: 100vh;
    }

    /* Modal Sheet Styling */
    .bill-card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 24px 20px 30px;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.15);
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .title {
      font-size: 20px;
      font-weight: 700;
      color: #1f2937;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .close-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #f3f4f6;
      border: none;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #4b5563;
    }

    .table-info {
      font-size: 14px;
      color: #374151;
      font-weight: 500;
      margin-bottom: 12px;
    }

    .divider {
      border: none;
      border-top: 1px dashed #d1d5db;
      margin-bottom: 16px;
    }

    /* Item Details */
    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .item-name {
      font-size: 15px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 4px;
    }

    .item-calc {
      font-size: 13px;
      color: #6b7280;
    }

    .quantity-controller {
      display: flex;
      align-items: center;
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 4px 8px;
      gap: 12px;
    }

    .qty-btn {
      border: none;
      background: transparent;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      color: #111827;
      width: 20px;
      text-align: center;
    }

    .qty-text {
      font-size: 14px;
      font-weight: 600;
    }

    /* Bill Summary Box */
    .bill-box {
      background-color: #faf7f2;
      border: 1px solid #f0eae1;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .bill-line {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      color: #4b5563;
      margin-bottom: 8px;
    }

    .bill-line.total {
      border-top: 1px dashed #d6cbbf;
      padding-top: 10px;
      margin-top: 10px;
      margin-bottom: 0;
      font-size: 18px;
      font-weight: 700;
      color: #111827;
    }

    /* WhatsApp Button */
    .whatsapp-btn {
      width: 100%;
      background-color: #52c46a;
      color: white;
      border: none;
      padding: 14px 20px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 10px rgba(82, 196, 106, 0.3);
      transition: background 0.2s ease;
    }

    .whatsapp-btn:hover {
      background-color: #45b05b;
    }
  </style>
</head>
<body>

  <div class="bill-card">
    <div class="header-row">
      <div class="title">🧾 Your Order (Bill)</div>
      <button class="close-btn" onclick="alert('Close Bill')">✕</button>
    </div>
    
    <div class="table-info">Table Number: <span id="table-num">1</span></div>
    <hr class="divider">

    <div class="item-row">
      <div>
        <div class="item-name" id="item-name">Classic Margherita Pizza (8")</div>
        <div class="item-calc">₹<span id="unit-price">249</span> × <span id="item-qty-calc">1</span> = ₹<span id="item-total-calc">249</span></div>
      </div>
      <div class="quantity-controller">
        <button class="qty-btn" onclick="updateQty(-1)">−</button>
        <span class="qty-text" id="item-qty">1</span>
        <button class="qty-btn" onclick="updateQty(1)">+</button>
      </div>
    </div>

    <div class="bill-box">
      <div class="bill-line">
        <span>Item Amount (Subtotal):</span>
        <span>₹<span id="subtotal">249</span></span>
      </div>
      <div class="bill-line">
        <span>CGST (2.5%):</span>
        <span>₹<span id="cgst">6.23</span></span>
      </div>
      <div class="bill-line">
        <span>SGST (2.5%):</span>
        <span>₹<span id="sgst">6.23</span></span>
      </div>
      <div class="bill-line total">
        <span>Grand Total:</span>
        <span>₹<span id="grand-total">261</span></span>
      </div>
    </div>

    <button class="whatsapp-btn" onclick="sendOrderViaWhatsApp()">
      Send Order on WhatsApp 📲
    </button>
  </div>

  <script>
    // કેફે / રેસ્ટોરન્ટનો WhatsApp નંબર અહીં દેશના કોડ સાથે લખો (દા.ત. 919876543210)
    const RESTAURANT_WHATSAPP_NUMBER = "919876543210"; 

    let quantity = 1;
    const pricePerItem = 249;

    function updateQty(change) {
      if (quantity + change >= 1) {
        quantity += change;
        calculateBill();
      }
    }

    function calculateBill() {
      const subtotal = quantity * pricePerItem;
      const cgst = (subtotal * 0.025);
      const sgst = (subtotal * 0.025);
      const grandTotal = Math.round(subtotal + cgst + sgst);

      // UI Update
      document.getElementById('item-qty').innerText = quantity;
      document.getElementById('item-qty-calc').innerText = quantity;
      document.getElementById('item-total-calc').innerText = subtotal;
      document.getElementById('subtotal').innerText = subtotal;
      document.getElementById('cgst').innerText = cgst.toFixed(2);
      document.getElementById('sgst').innerText = sgst.toFixed(2);
      document.getElementById('grand-total').innerText = grandTotal;
    }

    function sendOrderViaWhatsApp() {
      const tableNumber = document.getElementById('table-num').innerText;
      const itemName = document.getElementById('item-name').innerText;
      const subtotal = document.getElementById('subtotal').innerText;
      const cgst = document.getElementById('cgst').innerText;
      const sgst = document.getElementById('sgst').innerText;
      const grandTotal = document.getElementById('grand-total').innerText;

      // WhatsApp મેસેજ ફોર્મેટ
      const message = 
`🍽️ *નવો ઓર્ડર (New Order)* 🍽️
------------------------------
📍 *Table Number:* ${tableNumber}
------------------------------
🍕 *Items:*
• ${itemName}
  ${quantity} × ₹${pricePerItem} = ₹${subtotal}
------------------------------
*Subtotal:* ₹${subtotal}
*CGST (2.5%):* ₹${cgst}
*SGST (2.5%):* ₹${sgst}
------------------------------
💰 *Grand Total: ₹${grandTotal}*
------------------------------
કૃપા કરીને ઓર્ડર કન્ફર્મ કરો.`;

      // WhatsApp URL
      const whatsappUrl = `https://wa.me/${RESTAURANT_WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;

      // Direct WhatsApp ઓપન કરવા માટે
      window.open(whatsappUrl, '_blank');
    }
  </script>
</body>
</html>
